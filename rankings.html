<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Season Power Rankings — Wheels Up Collective</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:ital,opsz,wght@0,9..40,400;0,9..40,600;0,9..40,700;1,9..40,400&family=Syne:wght@600;700;800&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="css/styles.css" />
  <style>
    .rank-line {
      margin: 0.15rem 0 0.4rem;
      font-size: 0.85rem;
      color: var(--text-muted);
      font-variant-numeric: tabular-nums;
    }
  </style>
</head>
<body>
  <div id="site-nav"></div>
  <main class="wrap">
    <header class="page-hero">
      <span class="eyebrow" id="rankEyebrow">Week 1</span>
      <h1>Season power rankings</h1>
      <p class="lede" id="rankLede">Live Week 1 board — Thursday scores in, Sunday slate ahead.</p>
    </header>

    <ol class="rank-list" id="rankList"><li class="muted">Loading…</li></ol>
  </main>
  <div id="site-footer"></div>
  <script src="js/config.js"></script>
  <script src="js/main.js"></script>
  <script>
    document.addEventListener("DOMContentLoaded", async () => {
      try {
        await WUC.loadTeamColors();
        const data = await WUC.loadJSON("data/rankings.json");
        const week = data.week || 1;
        document.getElementById("rankEyebrow").textContent = `Week ${week} · ${data.season || ""}`.trim();
        const lede = data.subtitle || "1–14 with blurbs.";
        document.getElementById("rankLede").innerHTML =
          `${WUC.escapeHtml(lede)} <span class="dim">Updated ${WUC.formatDate(data.updated)}.</span>`;

        document.getElementById("rankList").innerHTML = (data.rankings || []).map((r) => {
          const opp = r.opponent || "—";
          const hasLive = r.liveScore != null && r.oppLiveScore != null
            && (Number(r.liveScore) > 0 || Number(r.oppLiveScore) > 0);
          const bits = [];
          if (r.faabLeft != null) bits.push(`FAAB $${r.faabLeft}`);
          bits.push(opp);
          if (hasLive) bits.push(`live ${Number(r.liveScore).toFixed(0)}–${Number(r.oppLiveScore).toFixed(0)}`);
          if (r.playersLeft != null) bits.push(`${r.playersLeft} left`);
          if (r.customW1 != null) bits.push(`W1 HQ ${Number(r.customW1).toFixed(0)}`);
          const line = bits.join(" · ");
          return `
          <li class="rank-row${r.rank <= 3 ? " top3" : ""}" style="--team-color:${(WUC.teamColors && WUC.teamColors[r.teamId] && WUC.teamColors[r.teamId].color) || '#69BE28'}">
            <div class="rank-num">${r.rank}</div>
            ${WUC.teamMark(r.teamId, { size: "md" })}
            <div>
              <div class="rank-meta">${WUC.escapeHtml(r.owner || "")}</div>
              <h2 class="rank-team">${WUC.escapeHtml(r.team)}</h2>
              <div class="rank-line">${WUC.escapeHtml(line)}</div>
              <p class="rank-blurb">${WUC.escapeHtml(r.blurb)}</p>
            </div>
          </li>`;
        }).join("");
      } catch (e) {
        console.error(e);
        document.getElementById("rankList").innerHTML = `<li class="muted">Couldn’t load rankings.</li>`;
      }
    });
  </script>
</body>
</html>
