<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Live matchups — Wheels Up Collective</title>
  <link rel="icon" href="img/wu-mark.png" type="image/png" />
  <link rel="apple-touch-icon" href="img/wu-mark.png" />
  <meta name="description" content="Wheels Up Collective live matchups — current score, projection, players left, and a 5% win-chance bar." />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:ital,opsz,wght@0,9..40,400;0,9..40,600;0,9..40,700;1,9..40,400&family=Syne:wght@600;700;800&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="css/styles.css" />
</head>
<body>
  <a class="skip-link" href="#main-content">Skip to content</a>
  <div id="site-nav"></div>
  <main class="wrap" id="main-content">
    <header class="page-hero">
      <span class="eyebrow" id="liveEyebrow">This week</span>
      <h1>Live matchups</h1>
      <p class="lede" id="liveLede">Current score, projected final, and how many starters are still out. The bar is a normal approximation, rounded to the nearest 5%.</p>
      <p class="last-sync" id="asOf">as of — PT</p>
    </header>

    <div id="liveBoard" aria-busy="true">
      <div class="skeleton-stack" aria-hidden="true">
        <div class="skeleton-bar"></div>
        <div class="skeleton-bar med"></div>
        <div class="skeleton-bar short"></div>
      </div>
    </div>
  </main>
  <div id="site-footer"></div>
  <script src="js/config.js"></script>
  <script src="js/main.js"></script>
  <script src="js/league.js"></script>
  <script type="module" src="js/matchups-page.js"></script>
</body>
</html>
