<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Trades — Wheels Up Collective</title>
  <link rel="icon" href="img/wu-mark.png" type="image/png" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:ital,opsz,wght@0,9..40,400;0,9..40,600;0,9..40,700;1,9..40,400&family=Syne:wght@600;700;800&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="css/styles.css" />
</head>
<body>
  <div id="site-nav"></div>
  <main class="wrap">
    <header class="page-hero">
      <span class="eyebrow">Deal sheet</span>
      <h1>Trade scoreboard</h1>
      <p class="lede">Completed deals only. <span class="muted" id="updatedLabel"></span></p>
    </header>

    <h2 style="font-size:1.05rem;margin:0 0 0.75rem">Completed</h2>
    <div id="tradeCompleted" aria-busy="true"><p class="muted">Loading…</p></div>

    <h2 style="font-size:1.05rem;margin:2rem 0 0.75rem">On the block</h2>
    <div id="tradeBlocks"><p class="muted">Loading…</p></div>
  </main>
  <div id="site-footer"></div>
  <script src="js/config.js"></script>
  <script src="js/main.js"></script>
  <script src="js/league.js"></script>
  <script>
    function teamLabel(label) {
      return WUC.teamLinkHtml(label, { size: "sm" });
    }

    function card(t) {
      const a = (t.givesA || t.aSends || []).join ? (t.givesA || t.aSends || []).map(WUC.escapeHtml).join(", ") : WUC.escapeHtml(String(t.givesA || t.aSends || "—"));
      const b = (t.givesB || t.bSends || []).join ? (t.givesB || t.bSends || []).map(WUC.escapeHtml).join(", ") : WUC.escapeHtml(String(t.givesB || t.bSends || "—"));
      const rawA = t.teamA || (t.teams && t.teams[0]) || "Team A";
      const rawB = t.teamB || (t.teams && t.teams[1]) || "Team B";
      const teamA = teamLabel(rawA);
      const teamB = teamLabel(rawB);
      const teamAText = WUC.escapeHtml(WUC.officialName(rawA));
      const teamBText = WUC.escapeHtml(WUC.officialName(rawB));
      const badge = t.official === false ? `<span class="sample-badge">handshake</span>` : "";
      const date = t.date ? WUC.formatDate(t.date) : "—";
      const week = t.week ? ` · Week ${WUC.escapeHtml(t.week)}` : "";
      return `
        <article class="card" style="margin-bottom:0.75rem">
          <h3 style="margin:0 0 0.35rem;display:flex;flex-wrap:wrap;align-items:center;gap:0.35rem 0.5rem">${teamA} <span aria-hidden="true">↔</span> ${teamB}
            ${badge}</h3>
          <p class="muted" style="margin:0 0 0.5rem;font-size:0.8rem">${date}${week}</p>
          <p><strong>${teamAText} sends:</strong> ${a || "—"}</p>
          <p><strong>${teamBText} sends:</strong> ${b || "—"}</p>
          <p class="muted mb-0">${WUC.escapeHtml(WUC.displayText(t.summary || t.notes || ""))}</p>
        </article>`;
    }

    function blockCard(b) {
      const players = Array.isArray(b.players) ? b.players.filter(Boolean) : [];
      const note = b.note || b.notes || "";
      if (!players.length && !b.player && !b.assets && !note) return "";
      const listed = players.length
        ? players.map((p) => WUC.escapeHtml(p)).join(", ")
        : WUC.escapeHtml(b.player || b.assets || "");
      return `
        <article class="card" style="margin-bottom:0.75rem">
          <h3 style="margin:0 0 0.35rem;display:flex;flex-wrap:wrap;align-items:center;gap:0.35rem 0.5rem">${teamLabel(b.teamId || b.team || "Team")}
            <span class="sample-badge">block</span></h3>
          <p class="mb-0">${listed ? `<strong>Listed:</strong> ${listed}` : ""}
            ${note ? `${listed ? " — " : ""}<span class="muted">${WUC.escapeHtml(note)}</span>` : ""}</p>
        </article>`;
    }

    document.addEventListener("DOMContentLoaded", async () => {
      try {
        await WUC.loadTeamColors();
        const teamsFile = await WUC.loadJSON("data/teams.json");
        WUC.indexTeams((teamsFile && teamsFile.teams) || []);
        const data = await WUC.loadJSON("data/trades.json?v=" + Date.now());
        if (data.updated) {
          document.getElementById("updatedLabel").textContent = "Updated " + data.updated;
        }
        const completed = WUC.completedTrades(data);
        const blocks = (data.blocks || []).map(blockCard).filter(Boolean);

        const empty = `<div class="card trade-empty"><div class="big">🤝</div>
          <h2 style="margin:0 0 0.35rem">Nothing here yet</h2>
          <p class="mb-0">No completed deals in the trade file yet.</p></div>`;

        const done = document.getElementById("tradeCompleted");
        done.removeAttribute("aria-busy");
        done.innerHTML = completed.length ? completed.map(card).join("") : empty;
        document.getElementById("tradeBlocks").innerHTML =
          blocks.length ? blocks.join("") : `<p class="muted">No trade-block listings on file.</p>`;
      } catch (e) {
        const done = document.getElementById("tradeCompleted");
        done.removeAttribute("aria-busy");
        done.innerHTML = WUC.softError("Trades didn’t load. Try Refresh.");
      }
    });
  </script>

</body>
</html>
