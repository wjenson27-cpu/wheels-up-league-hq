<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Rosters — Wheels Up Collective</title>
  <link rel="icon" href="img/wu-mark.png" type="image/png" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:ital,opsz,wght@0,9..40,400;0,9..40,600;0,9..40,700;1,9..40,400&family=Syne:wght@600;700;800&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="css/styles.css" />
</head>
<body>
  <div id="site-nav"></div>
  <main class="wrap">
    <header class="page-hero">
      <span class="eyebrow">All 14 clubs</span>
      <h1>Rosters &amp; transactions</h1>
      <p class="lede">Every club links to its own page. Open a card for the depth chart.</p>
    </header>

    <h2 style="font-size:1.1rem;margin:0 0 0.75rem">League field</h2>
    <div class="grid grid-2" id="teamGrid" aria-busy="true">
      <div class="skeleton-stack" aria-hidden="true"><div class="skeleton-bar"></div><div class="skeleton-bar med"></div><div class="skeleton-bar short"></div></div>
    </div>

    <h2 style="font-size:1.1rem;margin:2rem 0 0.75rem">League transaction feed</h2>
    <div class="card" id="txFull"><p class="muted">Loading…</p></div>
  </main>
  <div id="site-footer"></div>
  <script src="js/config.js"></script>
  <script src="js/main.js"></script>
  <script src="js/league.js"></script>
  <script>
    document.addEventListener("DOMContentLoaded", async () => {
      const grid = document.getElementById("teamGrid");
      const txHost = document.getElementById("txFull");
      try {
        await WUC.loadTeamColors();
        const [teamsData, tx] = await Promise.all([
          WUC.loadJSON("data/teams.json"),
          WUC.loadJSON("data/transactions.json")
        ]);
        const teams = teamsData.teams || [];
        WUC.indexTeams(teams);

        const cards = await Promise.all(teams.map(async (t) => {
          const safe = WUC.safeId(t.id);
          let rosterFile = safe ? await WUC.loadOptional(`data/rosters/${safe}.json`) : null;
          if ((!rosterFile || !rosterFile.roster) && t.id === "eddies") {
            rosterFile = await WUC.loadOptional("data/roster-eddies.json");
          }
          const depth = rosterFile && rosterFile.roster ? WUC.renderRoster(rosterFile.roster) : "";
          const faab = t.faab != null ? ` · FAAB $${t.faab}` : "";
          const pf = WUC.pointsFor(t);
          const pfBit = pf != null ? ` · ${WUC.formatPts(pf)} PF` : "";
          const note = WUC.publicNote((rosterFile && rosterFile.notes) || t.note || "");
          return `
          <article class="card team-card" id="team-${WUC.escapeHtml(t.id)}" style="--team-color:${WUC.escapeHtml(t.color || "#69BE28")}">
            <div class="team-head">
              <div>
                <h3 style="margin:0"><a class="team-link" href="${WUC.teamHref(t.id)}">${WUC.escapeHtml(t.name)}</a></h3>
                <p class="muted mb-0">${WUC.escapeHtml(t.owner || "Owner TBD")} · ${WUC.escapeHtml(WUC.recordLabel(t))}${pfBit}${faab}</p>
              </div>
              ${WUC.teamMark(t.id, { size: "lg" })}
            </div>
            <p class="mb-0"><a href="${WUC.teamHref(t.id)}">Clubhouse →</a></p>
            <details class="club-details">
              <summary>Depth chart</summary>
              ${note ? `<p>${WUC.escapeHtml(note)}</p>` : ""}
              ${depth || `<p class="muted mb-0">Depth chart isn’t in the files yet.</p>`}
            </details>
          </article>`;
        }));

        grid.removeAttribute("aria-busy");
        grid.innerHTML = cards.length ? cards.join("") : WUC.emptyState("No clubs in the team file yet.");

        const items = WUC.publicTransactions(tx.items || []);
        const renderTx = (list) => list.map((t) => `
          <div class="feed-item">
            <div class="feed-date">${WUC.formatDate(t.date)}</div>
            <div class="feed-body"><span class="type-tag">${WUC.escapeHtml(t.type || "Move")}</span>
              ${WUC.teamLinkHtml(t.teamId || t.team, { size: "sm" })} — ${WUC.escapeHtml(WUC.displayText(t.summary || ""))}</div>
          </div>`).join("");
        if (!items.length) {
          txHost.innerHTML = `<p class="muted mb-0">No transactions loaded yet.</p>`;
        } else {
          const first = items.slice(0, 25);
          txHost.innerHTML = renderTx(first) + (items.length > 25
            ? `<p class="mt-1 mb-0"><button type="button" class="btn btn-ghost" id="showAllTx">Show all ${items.length}</button></p>`
            : "");
          const more = document.getElementById("showAllTx");
          if (more) more.addEventListener("click", () => { txHost.innerHTML = renderTx(items); });
        }
      } catch (e) {
        grid.removeAttribute("aria-busy");
        grid.innerHTML = WUC.softError("Rosters didn’t load. Try Refresh.");
        txHost.innerHTML = "";
      }
    });
  </script>

</body>
</html>
