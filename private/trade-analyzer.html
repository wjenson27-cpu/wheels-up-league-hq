<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Trade analyzer — Eagleridge Eddie's</title>
  <meta name="robots" content="noindex, nofollow, noarchive" />
  <meta name="googlebot" content="noindex, nofollow" />
  <meta name="referrer" content="no-referrer" />
  <link rel="icon" href="../img/wu-mark.png" type="image/png" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:ital,opsz,wght@0,9..40,400;0,9..40,600;0,9..40,700;1,9..40,400&family=Syne:wght@600;700;800&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="../css/styles.css" />
  <style>
    .ta-banner { margin-bottom: 1rem; }
    .ta-banner h1 { margin: 0 0 0.35rem; font-size: clamp(1.6rem, 4vw, 2.2rem); }
    .ta-picks { display: grid; grid-template-columns: 1fr 1fr; gap: 0.75rem; margin-bottom: 0.85rem; }
    .ta-picks label { display: flex; flex-direction: column; gap: 0.3rem; font-size: 0.75rem; font-weight: 800; letter-spacing: 0.08em; text-transform: uppercase; color: var(--text-muted); min-width: 0; }
    .ta-picks select { width: 100%; max-width: 100%; background: var(--bg-elev); color: var(--text); border: 1px solid var(--border); border-radius: 8px; padding: 0.6rem 0.7rem; font: inherit; font-size: 0.95rem; text-transform: none; letter-spacing: 0; font-weight: 600; }
    .ta-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 0.75rem; min-width: 0; }
    .ta-result h2, .ta-roster h3, .ta-side h3 { margin: 0 0 0.45rem; }
    .ta-side h3, .ta-roster h3 { display: flex; align-items: center; gap: 0.5rem; font-size: 1.05rem; }
    .ta-side h4 { margin: 0.7rem 0 0.25rem; font-size: 0.78rem; letter-spacing: 0.08em; text-transform: uppercase; color: var(--text-muted); }
    .ta-summary { margin: 0 0 0.65rem; }
    .ta-season, .ta-note, .ta-starters, .ta-empty { margin: 0.35rem 0; color: var(--text-muted); font-size: 0.84rem; }
    .ta-meter { display: flex; height: 0.7rem; margin: 0 0 0.85rem; border-radius: 999px; overflow: hidden; background: rgba(0, 8, 18, 0.45); }
    .ta-meter span { display: block; height: 100%; }
    .ta-table { width: 100%; border-collapse: collapse; font-variant-numeric: tabular-nums; font-size: 0.82rem; }
    .ta-table th, .ta-table td { text-align: left; padding: 0.18rem 0.3rem; border-bottom: 1px solid var(--border); }
    .ta-table .is-changed td:last-child, .ta-table tr.is-changed td:last-child { color: var(--accent-hot); font-weight: 800; }
    .ta-holes { margin: 0.35rem 0 0; padding-left: 1.1rem; }
    .ta-holes li { margin: 0.1rem 0; }
    .ta-points { list-style: none; margin: 0; padding: 0; }
    .ta-points li { display: flex; flex-wrap: wrap; gap: 0.25rem 0.45rem; align-items: baseline; margin: 0.2rem 0; font-size: 0.88rem; }
    .ta-pos { color: var(--text-dim); font-size: 0.72rem; font-weight: 800; letter-spacing: 0.06em; }
    .ta-roster { max-height: 28rem; overflow: auto; }
    .ta-player { display: flex; gap: 0.45rem; align-items: flex-start; margin: 0.18rem 0; font-size: 0.88rem; }
    .ta-player span { min-width: 0; overflow-wrap: anywhere; }
    .ta-side, .ta-roster, .ta-result { min-width: 0; }
    .team-mark-sm { width: 36px; height: 36px; }
    @media (max-width: 800px) {
      .ta-picks, .ta-grid { grid-template-columns: 1fr; }
      .ta-roster { max-height: none; }
    }
  </style>
</head>
<body>
  <a class="skip-link" href="#main-content">Skip to content</a>
  <main class="wrap" id="main-content">
    <header class="page-hero ta-banner">
      <span class="eyebrow">Desk copy</span>
      <h1>Trade analyzer</h1>
      <p class="lede" id="taLede">Loading roster and ranking files.</p>
    </header>
    <div id="taApp" aria-busy="true">
      <div class="skeleton-stack" aria-hidden="true">
        <div class="skeleton-bar"></div>
        <div class="skeleton-bar med"></div>
      </div>
    </div>
  </main>
  <script src="../js/config.js"></script>
  <script type="module" src="trade-analyzer.js"></script>
</body>
</html>
